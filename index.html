<script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzVzu2KTA-WElihHshUicIvkYTJyQ0p3yfGEj3KwGd77cMFdygdmYfMk4FicO2uF-Bzwg/exec";

    const preview = document.getElementById('preview');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    const standbyBtn = document.getElementById('standbyBtn');
    const stopBtn = document.getElementById('stopBtn');
    const timerEl = document.getElementById('timer');
    const statusIndicator = document.getElementById('statusIndicator');
    const liveTranscriptEl = document.getElementById('liveTranscript');

    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recognition = null;
    let isWaitingForSpeech = false;
    let isSpeechRunning = false;

    let fullTranscript = "";
    const TARGET_DURATION = 270;
    let timeLeft = TARGET_DURATION;
    let timerInterval = null;
    let speechStartTime = 0;

    let lineChartInstance = null;
    let radarChartInstance = null;

    window.addEventListener('DOMContentLoaded', fetchHistoryData);

    // Web Speech API の初期設定
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            fullTranscript += event.results[i][0].transcript + " ";
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        liveTranscriptEl.innerText = fullTranscript + interim;
        liveTranscriptEl.scrollTop = liveTranscriptEl.scrollHeight;

        // 音声を検知したら本番計測へ移行
        if (isWaitingForSpeech && (fullTranscript.trim().length > 0 || interim.trim().length > 0)) {
          isWaitingForSpeech = false;
          triggerSpeechStart();
        }
      };

      recognition.onerror = (e) => {
        console.warn("Speech recognition error:", e.error);
        // モバイルでno-speechになっても待機中なら継続
        if (e.error === 'no-speech' && isWaitingForSpeech) {
          try { recognition.start(); } catch(err){}
        }
      };
    } else {
      alert("お使いのブラウザは音声認識APIに対応していません。Google Chromeをご利用ください。");
    }

    // 待機モードボタン（Android対策：タップ時にカメラ・マイクを事前確保）
    standbyBtn.onclick = async () => {
      fullTranscript = "";
      liveTranscriptEl.innerText = "カメラ・マイクを準備中...";
      
      try {
        // 1. ユーザー操作の直後でカメラ・マイクの権限を明示的に取得（Android必須）
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: true
        });
        preview.srcObject = stream;
        preview.style.display = "block";
        cameraPlaceholder.style.display = "none";

        // 2. コーデックの互換性チェック（Android対応）
        let options = { mimeType: 'video/webm' };
        if (MediaRecorder.isTypeSupported('video/webm; codecs=vp8,opus')) {
          options = { mimeType: 'video/webm; codecs=vp8,opus' };
        } else if (MediaRecorder.isTypeSupported('video/mp4')) {
          options = { mimeType: 'video/mp4' };
        }

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, options);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = handleRecordingComplete;

        // 3. 待機状態へ切り替え
        isWaitingForSpeech = true;
        isSpeechRunning = false;
        standbyBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        statusIndicator.innerText = "第一声 検知待機中（話し始めると計測開始）";
        statusIndicator.style.background = "#fef7e0";
        statusIndicator.style.color = "#b06000";
        liveTranscriptEl.innerText = "準備完了！第一声を待っています... 話し始めると自動でタイマーと録画が開始します。";

        // 音声認識スタート
        if (recognition) {
          try { recognition.start(); } catch(e){}
        }

      } catch (err) {
        alert("カメラ・マイクの起動に失敗しました。Androidの「設定」→「アプリ」→「Chrome」でカメラとマイクの権限が許可されているかご確認ください: " + err.message);
      }
    };

    // 第一声を検知した瞬間の処理
    function triggerSpeechStart() {
      isSpeechRunning = true;
      statusIndicator.innerText = "本番計測中（録画中）";
      statusIndicator.style.background = "#fce8e6";
      statusIndicator.style.color = "var(--danger)";

      // 事前準備しておいたレコーダーを録画開始
      if (mediaRecorder && mediaRecorder.state === 'inactive') {
        mediaRecorder.start();
      }

      speechStartTime = Date.now();
      timeLeft = TARGET_DURATION;
      timerInterval = setInterval(() => {
        timeLeft--;
        const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        timerEl.innerText = `${m}:${s}`;

        if (timeLeft <= 0) stopSpeech();
      }, 1000);
    }

    // 終了ボタン
    stopBtn.onclick = stopSpeech;

    function stopSpeech() {
      isWaitingForSpeech = false;
      isSpeechRunning = false;
      clearInterval(timerInterval);

      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      preview.srcObject = null;
      preview.style.display = "none";
      cameraPlaceholder.style.display = "block";
      cameraPlaceholder.innerText = "カメラ停止中（AI審査中）";

      standbyBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
      statusIndicator.innerText = "計測完了・解析中";
      statusIndicator.style.background = "#e8f0fe";
      statusIndicator.style.color = "var(--primary)";
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64String = reader.result.split(',')[1];
          resolve(base64String);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function handleRecordingComplete() {
      const elapsedSec = Math.round((Date.now() - speechStartTime) / 1000);
      const elapsedMinutes = elapsedSec / 60;
      const wordCount = fullTranscript.trim().split(/\s+/).filter(Boolean).length;
      const wpm = elapsedMinutes > 0 ? Math.round(wordCount / elapsedMinutes) : 0;

      document.getElementById('resultCard').style.display = 'block';

      const evalStatus = document.getElementById('evalStatus');
      const reportContent = document.getElementById('reportContent');
      evalStatus.innerText = "【1/2】録画映像をエンコード中...";
      reportContent.innerText = "";

      try {
        const mimeType = mediaRecorder ? mediaRecorder.mimeType : 'video/webm';
        const videoBlob = new Blob(recordedChunks, { type: mimeType });
        const base64Video = await blobToBase64(videoBlob);

        evalStatus.innerText = "【2/2】本選審査基準（厳格モード）で審査中（約30〜45秒）...";

        const res = await fetch(GAS_ENDPOINT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            name: document.getElementById('studentName').value,
            date: new Date().toLocaleString('ja-JP'),
            duration: elapsedSec,
            wpm: wpm,
            wordCount: wordCount,
            script: document.getElementById('scriptText').value,
            transcript: fullTranscript,
            videoBase64: base64Video
          })
        });

        const data = await res.json();

        if (data.status === "success") {
          document.getElementById('resTotalScore').innerText = data.scores.totalScore;
          document.getElementById('resScoreAccuracy').innerText = data.scores.scoreAccuracy;
          document.getElementById('resScorePacing').innerText = data.scores.scorePacing;
          document.getElementById('resScorePause').innerText = data.scores.scorePause;
          document.getElementById('resScoreVoiceTone').innerText = data.scores.scoreVoiceTone;
          document.getElementById('resScorePosture').innerText = data.scores.scorePosture;
          
          reportContent.innerText = data.report;
          evalStatus.innerText = "審査完了・スコアをダッシュボードに反映しました！";
          fetchHistoryData();
        } else {
          throw new Error(data.message || "GAS審査エラー");
        }

      } catch (err) {
        evalStatus.innerText = "エラー: " + err.message;
        reportContent.innerText = "詳細エラー: " + err.message;
      }
    }

    async function fetchHistoryData() {
      const studentName = document.getElementById('studentName').value.trim();
      const tbody = document.getElementById('historyTableBody');
      tbody.innerHTML = '<tr><td colspan="10">最新データを読み込み中...</td></tr>';

      try {
        const url = `${GAS_ENDPOINT_URL}?studentName=${encodeURIComponent(studentName)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === "success" && data.history) {
          renderDashboard(data.history);
        } else {
          tbody.innerHTML = '<tr><td colspan="10">練習データがまだありません。</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="10">データ取得エラー: ${err.message}</td></tr>`;
      }
    }

    function getRankBadge(score) {
      if (score >= 85) return '<span class="status-ribbon ribbon-pass">🏆 本選入賞圏</span>';
      if (score >= 75) return '<span class="status-ribbon ribbon-target"> 入賞候補</span>';
      return '<span class="status-ribbon ribbon-warn">要改善</span>';
    }

    function renderDashboard(history) {
      const tbody = document.getElementById('historyTableBody');
      tbody.innerHTML = "";

      if (history.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10">練習データがまだありません。</td></tr>';
        document.getElementById('dashTotalAttempts').innerText = "0";
        document.getElementById('dashBestScore').innerText = "0";
        document.getElementById('dashRankJudge').innerText = "-";
        document.getElementById('dashLatestWpm').innerText = "0";
        document.getElementById('dashLatestDuration').innerText = "00:00";
        return;
      }

      document.getElementById('dashTotalAttempts').innerText = history.length;
      const best = Math.max(...history.map(h => h.totalScore));
      document.getElementById('dashBestScore').innerText = best;
      const latest = history[history.length - 1];
      
      document.getElementById('dashLatestWpm').innerText = latest.wpm;
      document.getElementById('dashLatestDuration').innerText = latest.durationFormatted;

      if (latest.totalScore >= 85) {
        document.getElementById('dashRankJudge').innerHTML = '<span style="color:var(--success)">🏆 入賞圏内</span>';
      } else if (latest.totalScore >= 75) {
        document.getElementById('dashRankJudge').innerHTML = '<span style="color:var(--gold)"> あと少し</span>';
      } else {
        document.getElementById('dashRankJudge').innerHTML = '<span style="color:var(--danger)">要特訓</span>';
      }

      const reversed = [...history].reverse();
      reversed.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.date}</td>
          <td><strong>${row.totalScore}</strong></td>
          <td>${getRankBadge(row.totalScore)}</td>
          <td>${row.scoreAccuracy || '-'}</td>
          <td>${row.scorePacing || '-'}</td>
          <td>${row.scorePause || '-'}</td>
          <td>${row.scoreVoiceTone || '-'}</td>
          <td>${row.scorePosture || '-'}</td>
          <td>${row.durationFormatted}</td>
          <td>${row.wpm}</td>
        `;
        tbody.appendChild(tr);
      });

      updateCharts(history);
    }

    function updateCharts(history) {
      const labels = history.map((_, i) => `#${i + 1}`);
      const totalScores = history.map(h => h.totalScore);
      const benchmarkScores = history.map(() => 85);

      const ctxLine = document.getElementById('scoreLineChart').getContext('2d');
      if (lineChartInstance) lineChartInstance.destroy();
      lineChartInstance = new Chart(ctxLine, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '総合得点 (実測)',
              data: totalScores,
              borderColor: '#1a73e8',
              backgroundColor: 'rgba(26, 115, 232, 0.1)',
              borderWidth: 3,
              tension: 0.2,
              fill: true
            },
            {
              label: '🏆 本選入賞ボーダー (85点)',
              data: benchmarkScores,
              borderColor: '#f29900',
              borderWidth: 2,
              borderDash: [6, 4],
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 0, max: 100 } }
        }
      });

      const latest = history[history.length - 1];
      const ctxRadar = document.getElementById('scoreRadarChart').getContext('2d');
      if (radarChartInstance) radarChartInstance.destroy();
      radarChartInstance = new Chart(ctxRadar, {
        type: 'radar',
        data: {
          labels: ['単語正確性', '話速の緩急', '無音のタメ', 'セリフ表現', '所作・手位置'],
          datasets: [
            {
              label: '最新回スコア (実測)',
              data: [
                latest.scoreAccuracy || 0,
                latest.scorePacing || 0,
                latest.scorePause || 0,
                latest.scoreVoiceTone || 0,
                latest.scorePosture || 0
              ],
              backgroundColor: 'rgba(26, 115, 232, 0.25)',
              borderColor: '#1a73e8',
              pointBackgroundColor: '#1a73e8',
              borderWidth: 2
            },
            {
              label: '🏆 本選入賞レベル (各17点)',
              data: [17, 17, 17, 17, 17],
              borderColor: '#f29900',
              borderWidth: 2,
              borderDash: [4, 4],
              pointBackgroundColor: '#f29900',
              backgroundColor: 'rgba(242, 153, 0, 0.05)',
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              suggestedMin: 0,
              suggestedMax: 20,
              ticks: { stepSize: 4 }
            }
          }
        }
      });
    }
  </script>
